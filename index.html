<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>妙文歌词 · 拼音伴唱</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --sky-50:  #f0f8ff;
    --sky-100: #e0f1fb;
    --sky-200: #c5e4f5;
    --sky-300: #9fd1ec;
    --sky-400: #73b8de;
    --sky-500: #4ea0cc;
    --sky-600: #3684b0;
    --sky-700: #2a6b91;
    --ink-500: #5a6b7a;
    --ink-700: #3a4a5a;
    --ink-900: #233343;
    --line:    #d6e6f2;
    --white:   #ffffff;
  }
  
  html, body {
    height: 100%;
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    color: var(--ink-900);
    background: linear-gradient(160deg, var(--sky-50) 0%, #f7fbff 50%, var(--sky-100) 100%);
    background-attachment: fixed;
  }
  
  /* 云朵装饰 */
  .cloud {
    position: fixed;
    pointer-events: none;
    opacity: .5;
    filter: drop-shadow(0 4px 12px rgba(115,184,222,.25));
    z-index: 0;
  }
  .c1 { top: 60px;  left: -20px;  width: 180px; }
  .c2 { top: 240px; right: -30px; width: 140px; opacity:.35; }
  .c3 { bottom: 80px; left: 40%;  width: 200px; opacity:.25; }
  
  /* 顶部导航 */
  header {
    position: relative;
    z-index: 2;
    padding: 18px 28px;
    display: flex;
    align-items: center;
    gap: 18px;
    background: rgba(255,255,255,.55);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 600;
    color: var(--sky-700);
    letter-spacing: .5px;
  }
  .logo svg { width: 30px; height: 30px; }
  .sub-tag {
    font-size: 12px;
    color: var(--ink-500);
    padding: 3px 10px;
    background: var(--sky-100);
    border-radius: 12px;
  }
  .header-spacer { flex: 1; }
  .toggle-btn {
    padding: 6px 14px;
    font-size: 13px;
    border: 1px solid var(--line);
    background: var(--white);
    color: var(--ink-700);
    border-radius: 16px;
    cursor: pointer;
    transition: all .2s ease;
  }
  .toggle-btn:hover { border-color: var(--sky-400); color: var(--sky-600); }
  .toggle-btn.active {
    background: var(--sky-400);
    color: var(--white);
    border-color: var(--sky-400);
    box-shadow: 0 2px 8px rgba(115,184,222,.35);
  }
  
  /* 主体布局 */
  main {
    position: relative;
    z-index: 1;
    max-width: 960px;
    margin: 24px auto;
    padding: 0 20px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 20px;
  }
  
  /* 歌单侧栏 */
  aside {
    background: rgba(255,255,255,.7);
    backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    height: fit-content;
    position: sticky;
    top: 20px;
  }
  aside h2 {
    font-size: 14px;
    color: var(--ink-500);
    margin-bottom: 12px;
    padding-left: 4px;
  }
  .search-box {
    width: 100%;
    padding: 8px 14px;
    border: 1px solid var(--line);
    border-radius: 20px;
    background: var(--sky-50);
    font-size: 13px;
    outline: none;
    margin-bottom: 12px;
    transition: all .2s;
  }
  .search-box:focus {
    border-color: var(--sky-400);
    background: var(--white);
    box-shadow: 0 0 0 3px rgba(115,184,222,.15);
  }
  .song-list { list-style: none; max-height: 60vh; overflow-y: auto; }
  .song-list::-webkit-scrollbar { width: 6px; }
  .song-list::-webkit-scrollbar-thumb { background: var(--sky-200); border-radius: 3px; }
  .song-item {
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    transition: all .2s;
    margin-bottom: 4px;
  }
  .song-item:hover { background: var(--sky-100); }
  .song-item.active {
    background: linear-gradient(135deg, var(--sky-200) 0%, var(--sky-100) 100%);
    box-shadow: inset 0 0 0 1px var(--sky-300);
  }
  .song-item .s-name { font-size: 14px; font-weight: 500; color: var(--ink-900); }
  .song-item .s-artist { font-size: 12px; color: var(--ink-500); margin-top: 2px; }
  
  /* 歌词卡片 */
  .lyrics-card {
    background: rgba(255,255,255,.75);
    backdrop-filter: blur(12px);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 32px 36px;
    box-shadow: 0 4px 24px rgba(115,184,222,.1);
  }
  
  /* 歌曲信息 */
  .song-header {
    text-align: center;
    padding-bottom: 20px;
    margin-bottom: 24px;
    border-bottom: 1px dashed var(--line);
  }
  .song-title {
    font-size: 28px;
    font-weight: 600;
    color: var(--sky-700);
    margin-bottom: 6px;
  }
  .song-meta {
    font-size: 13px;
    color: var(--ink-500);
  }
  
  /* 音频播放器 */
  .player-bar {
    background: var(--sky-100);
    border-radius: 14px;
    padding: 14px 18px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .player-bar audio { flex: 1; height: 36px; }
  .player-bar .import-btn {
    padding: 8px 16px;
    background: var(--sky-500);
    color: white;
    border: none;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
  }
  .player-bar .import-btn:hover {
    background: var(--sky-600);
    box-shadow: 0 2px 8px rgba(78,160,204,.4);
  }
  .player-bar input[type=file] { display: none; }
  
  /* 同步控制 */
  .sync-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .sync-bar button {
    padding: 7px 16px;
    font-size: 13px;
    border: 1px solid var(--sky-300);
    background: var(--white);
    color: var(--sky-600);
    border-radius: 20px;
    cursor: pointer;
    transition: all .2s;
  }
  .sync-bar button:hover { background: var(--sky-100); }
  .sync-bar button.primary {
    background: var(--sky-500);
    color: white;
    border-color: var(--sky-500);
  }
  .sync-bar button.primary:hover { background: var(--sky-600); }
  
  /* 歌词区 */
  .lyrics-area {
    padding: 10px 0;
  }
  .line-block {
    padding: 14px 20px;
    border-radius: 12px;
    margin-bottom: 4px;
    cursor: pointer;
    transition: all .3s ease;
    position: relative;
  }
  .line-block:hover { background: var(--sky-50); }
  .line-block.current {
    background: linear-gradient(135deg, var(--sky-100) 0%, var(--sky-50) 100%);
    box-shadow: 0 2px 12px rgba(115,184,222,.2);
  }
  
  .char-row {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    flex-wrap: wrap;
    gap: 2px;
  }
  .char-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 28px;
  }
  .pinyin {
    font-size: 11px;
    color: var(--sky-500);
    font-weight: 500;
    height: 14px;
    line-height: 14px;
    letter-spacing: .5px;
    transition: opacity .2s;
  }
  .pinyin.hidden { opacity: 0; }
  .hanzi {
    font-size: 22px;
    color: var(--ink-900);
    line-height: 1.3;
    font-weight: 400;
  }
  .line-block.current .hanzi {
    color: var(--sky-700);
    font-weight: 600;
  }
  .line-block.current .pinyin {
    color: var(--sky-600);
    font-weight: 700;
  }
  
  /* 时间戳（每行左侧） */
  .line-time {
    position: absolute;
    left: 4px;
    top: 16px;
    font-size: 10px;
    color: var(--ink-500);
    font-family: monospace;
    opacity: 0;
    transition: opacity .2s;
  }
  .line-block:hover .line-time { opacity: 1; }
  
  /* 无拼音的行（间奏） */
  .line-block.only-hanzi .hanzi {
    font-size: 20px;
    color: var(--ink-500);
  }
  
  /* 分隔线 */
  .divider {
    text-align: center;
    color: var(--sky-300);
    font-size: 18px;
    padding: 6px 0;
    letter-spacing: 12px;
  }
  
  /* 页脚 */
  footer {
    text-align: center;
    padding: 28px 20px;
    color: var(--ink-500);
    font-size: 12px;
    position: relative;
    z-index: 1;
  }
  footer a { color: var(--sky-500); text-decoration: none; }
  footer a:hover { color: var(--sky-700); }
  
  /* 响应式 */
  @media (max-width: 720px) {
    main { grid-template-columns: 1fr; }
    aside { position: relative; top: 0; }
    .song-header .song-title { font-size: 22px; }
    .lyrics-card { padding: 22px 18px; border-radius: 16px; }
    .hanzi { font-size: 18px; }
    .pinyin { font-size: 10px; min-height: 12px; }
    .header-toggle-group { display: none; }
  }
  
  /* 动画：淡入 */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .line-block { animation: fadeInUp .3s ease both; }
  
  /* 间奏图标 */
  .interlude {
    text-align: center;
    padding: 10px 0;
    color: var(--sky-300);
    letter-spacing: 8px;
  }
</style>
</head>
<body>

<!-- 云朵装饰 -->
<svg class="cloud c1" viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">

<!-- 顶部 -->
<header>
  <div class="logo">
    <svg viewBox="0 0 40 40" fill="none">
      <circle cx="20" cy="20" r="18" fill="url(#g1)" />

    妙文歌词
  </div>
  <span class="sub-tag">拼音 · 简谱 · 伴唱</span>
  <div class="header-spacer"></div>
  <button class="toggle-btn active" onclick="togglePinyin(this)">拼音</button>
  <button class="toggle-btn" onclick="toggleHanzi(this)">汉字</button>
</header>

<main>
  <!-- 歌单侧栏 -->
  <aside>
    <h2>🎵 歌单</h2>
    <input type="text" class="search-box" id="searchInput" placeholder="搜索歌名 / 歌手...">
    <ul class="song-list" id="songList"></ul>
  </aside>

  <!-- 歌词主区 -->
  <section class="lyrics-card">
    <div class="song-header">
      <div class="song-title" id="songTitle">选择一首歌开始 ♪</div>
      <div class="song-meta" id="songMeta">共 0 行</div>
    </div>

    <div class="player-bar">
      <audio id="player" controls preload="metadata"></audio>
      <button class="import-btn" onclick="document.getElementById('fileInput').click()">🎵 导入音乐</button>
      <input type="file" id="fileInput" accept="audio/*" onchange="importMusic(event)">
    </div>

    <div class="sync-bar">
      <button onclick="adjustTime(-500)">⟵ 慢 0.5s</button>
      <button class="primary" onclick="setCurrentLine()">▶ 从当前行计时</button>
      <button onclick="adjustTime(500)">快 0.5s ⟶</button>
      <button onclick="resetOffset()">↺ 重置</button>
    </div>

    <div class="lyrics-area" id="lyricsArea"></div>
  </section>
</main>

<footer>
  ☁️ 云间歌词 · 让听歌变得有趣 · 所有音频仅在本地播放，不会上传
</footer>

/* ============ 初始化 ============ */

const lyricsEl = document.getElementById("lyricsArea");
const player = document.getElementById("player");

function renderSongList(filter="") {
  const kw = filter.trim().toLowerCase();
  listEl.innerHTML = SONGS.map((s,i) => {
    const hit = !kw || s.title.toLowerCase().includes(kw) || s.artist.toLowerCase().includes(kw);

      <div class="s-name">${s.title}</div>
      <div class="s-artist">${s.artist}</div>

  }).join("");
  listEl.querySelectorAll(".song-item").forEach(el => {
    el.onclick = () => loadSong(+el.dataset.i);
  });
}

document.getElementById("searchInput").addEventListener("input", e => {
  renderSongList(e.target.value);
});

function loadSong(idx) {
  currentSong = SONGS[idx];
  currentOffset = 0;
  lastClickTime = 0;
  
  // 高亮
  document.querySelectorAll(".song-item").forEach((el,i) => {
    el.classList.toggle("active", i === idx);
  });
  
  // 头部
  document.getElementById("songTitle").textContent = currentSong.title;
  document.getElementById("songMeta").textContent =
    `—— ${currentSong.artist} ——  ${currentSong.beat || ""}  ·  ${currentSong.lines.length} 行`;
  
  // 渲染歌词
  renderLyrics();
  
  // 加载音频
  if (currentSong.audioUrl) {
    player.src = currentSong.audioUrl;
  }
}

function renderLyrics() {
  if (!currentSong) return;
  lyricsEl.innerHTML = currentSong.lines.map((line, i) => {
    if (line.only) {
      return `<div class="interlude" data-i="${i}">${line.hz}</div>`;
    }
    const pinyinHtml = line.py.map(p => 
      `<span class="pinyin">${p}</span>`
    ).join("");
    const hanziHtml = line.hz.split(/\s+/).map(c => 
      `<span class="hanzi">${c}</span>`
    ).join("");
    return `<div class="line-block" data-i="${i}">
      <span class="line-time">${fmtTime(line.t)}</span>
      <div class="char-row">
        ${line.py.map((p,k) => `
          <span class="char-cell">
            <span class="pinyin">${p}</span>
            <span class="hanzi">${line.hz.split(/\s+/)[k] || ""}</span>
          </span>
        `).join("")}
      </div>
    </div>`;
  }).join("");
  
  // 点击行 = 从该行计时
  lyricsEl.querySelectorAll(".line-block").forEach(el => {
    el.onclick = () => {
      const idx = +el.dataset.i;
      const targetMs = currentSong.lines[idx].t;
      currentOffset = player.currentTime * 1000 - targetMs;
      // 滚动到可见
      el.scrollIntoView({ behavior: "smooth", block: "center" });
    };
  });
}

/* ============ 时间格式化 ============ */
function fmtTime(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  return `${m}:${String(s % 60).padStart(2,"0")}`;
}

/* ============ 同步逻辑 ============ */
player.addEventListener("timeupdate", () => {
  if (!currentSong) return;
  const nowMs = player.currentTime * 1000 - currentOffset;
  let activeIdx = -1;
  for (let i = 0; i < currentSong.lines.length; i++) {
    if (nowMs >= currentSong.lines[i].t) activeIdx = i;
    else break;
  }
  document.querySelectorAll(".line-block").forEach((el,i) => {
    el.classList.toggle("current", i === activeIdx);
    if (i === activeIdx) {
      // 自动滚动居中
      const rect = el.getBoundingClientRect();
      const container = document.querySelector(".lyrics-card");
      const cRect = container.getBoundingClientRect();
      if (rect.top < cRect.top + 40 || rect.bottom > cRect.bottom - 40) {
        el.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    }
  });
});

/* ============ 手动同步控制 ============ */
function adjustTime(delta) {
  currentOffset -= delta;
  // 视觉反馈
  flashHint(delta > 0 ? `+0.5s` : `-0.5s`);
}
function setCurrentLine() {
  if (!currentSong) return;
  // 找到当前高亮行
  const cur = document.querySelector(".line-block.current");
  if (!cur) return;
  const idx = +cur.dataset.i;
  const targetMs = currentSong.lines[idx].t;
  currentOffset = player.currentTime * 1000 - targetMs;
  flashHint("✓ 已对齐");
}
function resetOffset() {
  currentOffset = 0;
  flashHint("↺ 重置");
}

function flashHint(text) {
  const hint = document.createElement("div");
  hint.textContent = text;
  hint.style.cssText = `
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(78,160,204,.9); color: white;
    padding: 10px 22px; border-radius: 24px;
    font-size: 14px; z-index: 9999;
    box-shadow: 0 4px 16px rgba(78,160,204,.4);
    transition: opacity .4s;
  `;
  document.body.appendChild(hint);
  setTimeout(() => hint.style.opacity = "0", 800);
  setTimeout(() => hint.remove(), 1200);
}

/* ============ 导入本地音乐 ============ */
function importMusic(e) {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  player.src = url;
  player.play();
}

/* ============ 显示开关 ============ */
function togglePinyin(btn) {
  const show = btn.classList.toggle("active");
  document.querySelectorAll(".pinyin").forEach(p => {
    p.classList.toggle("hidden", !show);
    p.style.opacity = show ? "" : 0;
  });
}
function toggleHanzi(btn) {
  const show = btn.classList.toggle("active");
  document.querySelectorAll(".hanzi").forEach(p => {
    p.style.display = show ? "" : "none";
  });
}

/* ============ 启动 ============ */
renderSongList();
loadSong(0);
</script>
</body>
</html>
